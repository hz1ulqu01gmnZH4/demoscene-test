<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ray-Marched Microdemo</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: 'Space Mono', 'Courier New', monospace;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: radial-gradient(circle at top, #07090f, #020204 60%);
        color: #d4f0ff;
        min-height: 100vh;
        overflow: hidden;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
      }
      #ui {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        text-align: center;
        padding: 1rem;
        gap: 1rem;
        font-size: clamp(0.9rem, 2vw, 1.2rem);
      }
      #start-btn {
        pointer-events: auto;
        border: 1px solid rgba(255, 255, 255, 0.4);
        background: rgba(8, 12, 32, 0.8);
        color: #f4ffff;
        padding: 0.9rem 2rem;
        border-radius: 999px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
        transition: transform 0.2s ease, background 0.2s ease;
      }
      #start-btn:disabled {
        opacity: 0.7;
        cursor: progress;
      }
      #start-btn:not(:disabled):hover {
        transform: scale(1.05);
        background: rgba(32, 64, 128, 0.8);
      }
      #status {
        opacity: 0.7;
      }
      body.started #ui {
        animation: fadeOut 1.2s ease forwards;
        animation-delay: 0.5s;
      }
      @keyframes fadeOut {
        to {
          opacity: 0;
          transform: translateY(-30px);
        }
      }
      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <canvas id="glcanvas"></canvas>
    <section id="ui">
      <div>Tap to unleash ray-marched geometry synced to procedural audio.</div>
      <button id="start-btn">Tap to start</button>
      <div id="status"></div>
    </section>
    <script>
      const canvas = document.getElementById('glcanvas');
      const startBtn = document.getElementById('start-btn');
      const statusEl = document.getElementById('status');
      const gl = canvas.getContext('webgl2', { antialias: false });

      if (!gl) {
        statusEl.textContent = 'WebGL2 is required for this demo.';
        startBtn.disabled = true;
        throw new Error('WebGL2 not supported');
      }

      const state = {
        startTime: 0,
        running: false,
        analyser: null,
        freqData: null,
        audioLevels: new Float32Array([0, 0, 0]),
        audioCtx: null,
        melodyTimer: null,
      };

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const width = Math.floor(window.innerWidth * dpr);
        const height = Math.floor(window.innerHeight * dpr);
        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width;
          canvas.height = height;
          gl.viewport(0, 0, width, height);
        }
      }

      window.addEventListener('resize', resize);
      resize();

      const vsSource = `#version 300 es\n` +
        `layout(location = 0) in vec2 position;\n` +
        `out vec2 vUv;\n` +
        `void main() {\n` +
        `  vUv = position * 0.5 + 0.5;\n` +
        `  gl_Position = vec4(position, 0.0, 1.0);\n` +
        `}`;

      const fsSource = `#version 300 es\n` +
        `precision highp float;\n` +
        `out vec4 fragColor;\n` +
        `uniform vec2 uResolution;\n` +
        `uniform float uTime;\n` +
        `uniform vec3 uCameraPos;\n` +
        `uniform mat3 uCameraMatrix;\n` +
        `uniform vec3 uAudio;\n` +
        `\n` +
        `const int MAX_STEPS = 120;\n` +
        `const float MAX_DIST = 80.0;\n` +
        `const float SURF_DIST = 0.0015;\n` +
        `\n` +
        `float hash(vec3 p) {\n` +
        `  p = fract(p * 0.3183099 + 0.1);\n` +
        `  p *= 17.0;\n` +
        `  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));\n` +
        `}\n` +
        `\n` +
        `float sdSphere(vec3 p, float r) { return length(p) - r; }\n` +
        `float sdBox(vec3 p, vec3 b) {\n` +
        `  vec3 d = abs(p) - b;\n` +
        `  return length(max(d, 0.0)) + min(max(d.x, max(d.y, d.z)), 0.0);\n` +
        `}\n` +
        `\n` +
        `vec2 opUnion(vec2 a, vec2 b) { return a.x < b.x ? a : b; }\n` +
        `vec2 opSmoothUnion(vec2 a, vec2 b, float k) {\n` +
        `  float h = clamp(0.5 + 0.5 * (b.x - a.x) / k, 0.0, 1.0);\n` +
        `  float dist = mix(b.x, a.x, h) - k * h * (1.0 - h);\n` +
        `  float matId = mix(b.y, a.y, h);\n` +
        `  return vec2(dist, matId);\n` +
        `}\n` +
        `\n` +
        `vec3 repeatXZ(vec3 p, float c) {\n` +
        `  p.xz = mod(p.xz + c * 0.5, c) - c * 0.5;\n` +
        `  return p;\n` +
        `}\n` +
        `\n` +
        `vec2 map(vec3 p) {\n` +
        `  vec3 q = p;\n` +
        `  float bass = uAudio.x;\n` +
        `  float mid = uAudio.y;\n` +
        `  vec3 rp = repeatXZ(p, 6.0);\n` +
        `  float columns = sdBox(rp - vec3(0.0, 1.2 + 0.6 * sin(uTime + rp.x * 0.5), 0.0), vec3(0.4, 1.5 + bass * 3.0, 0.4));\n` +
        `  vec2 res = vec2(columns, 1.0);\n` +
        `\n` +
        `  vec3 swirl = p;\n` +
        `  float angle = uTime * 0.35 + bass * 3.0;\n` +
        `  float c = cos(angle); float s = sin(angle);\n` +
        `  swirl.xz = mat2(c, -s, s, c) * swirl.xz;\n` +
        `  float sphere = sdSphere(swirl - vec3(0.0, 0.3 + mid * 1.5, 0.0), 1.4 + 0.4 * sin(uTime * 0.8));\n` +
        `  res = opSmoothUnion(res, vec2(sphere, 2.0), 0.65);\n` +
        `\n` +
        `  float ripple = p.y + 1.3 + 0.25 * sin(p.x * 1.3 + uTime) * sin(p.z * 1.1 - uTime * 0.7) - bass * 2.0;\n` +
        `  res = opUnion(res, vec2(ripple, 3.0));\n` +
        `\n` +
        `  float rings = sdSphere(p - vec3(0.0, 5.0, 0.0), 5.0) - 0.02 * sin(12.0 * hash(p));\n` +
        `  res = opUnion(res, vec2(rings, 4.0));\n` +
        `  return res;\n` +
        `}\n` +
        `\n` +
        `vec3 getNormal(vec3 p) {\n` +
        `  const vec2 e = vec2(0.0005, 0.0);\n` +
        `  return normalize(vec3(\n` +
        `    map(p + e.xyy).x - map(p - e.xyy).x,\n` +
        `    map(p + e.yxy).x - map(p - e.yxy).x,\n` +
        `    map(p + e.yyx).x - map(p - e.yyx).x\n` +
        `  ));\n` +
        `}\n` +
        `\n` +
        `float softShadow(vec3 ro, vec3 rd) {\n` +
        `  float shade = 1.0;\n` +
        `  float dist = 0.02;\n` +
        `  for (int i = 0; i < 40; i++) {\n` +
        `    vec3 pos = ro + rd * dist;\n` +
        `    float h = map(pos).x;\n` +
        `    shade = min(shade, 8.0 * h / dist);\n` +
        `    dist += clamp(h, 0.01, 0.3);\n` +
        `    if (shade < 0.01 || dist > 30.0) break;\n` +
        `  }\n` +
        `  return clamp(shade, 0.0, 1.0);\n` +
        `}\n` +
        `\n` +
        `vec3 palette(float id, float accent) {\n` +
        `  if (id < 1.5) {\n` +
        `    return mix(vec3(0.1, 0.3, 0.8), vec3(0.8, 0.9, 1.0), accent);\n` +
        `  } else if (id < 2.5) {\n` +
        `    return mix(vec3(0.8, 0.2, 0.4), vec3(1.0, 0.8, 0.2), accent);\n` +
        `  } else if (id < 3.5) {\n` +
        `    return mix(vec3(0.1, 0.08, 0.15), vec3(0.3, 0.4, 0.5), accent);\n` +
        `  }\n` +
        `  return vec3(0.2, 0.6, 0.9);\n` +
        `}\n` +
        `\n` +
        `vec3 raymarch(vec3 ro, vec3 rd, out float steps, out vec2 hit) {\n` +
        `  float total = 0.0;\n` +
        `  steps = 0.0;\n` +
        `  vec2 scene;\n` +
        `  for (int i = 0; i < MAX_STEPS; i++) {\n` +
        `    vec3 pos = ro + rd * total;\n` +
        `    scene = map(pos);\n` +
        `    if (scene.x < SURF_DIST || total > MAX_DIST) break;\n` +
        `    total += scene.x;\n` +
        `    steps = float(i);\n` +
        `  }\n` +
        `  hit = vec2(total, scene.y);\n` +
        `  return ro + rd * total;\n` +
        `}\n` +
        `\n` +
        `void main() {\n` +
        `  vec2 uv = (gl_FragCoord.xy / uResolution.xy) * 2.0 - 1.0;\n` +
        `  uv.x *= uResolution.x / uResolution.y;\n` +
        `  vec3 rd = normalize(uCameraMatrix * vec3(uv, 1.6));\n` +
        `  vec3 ro = uCameraPos;\n` +
        `  float steps; vec2 hit;\n` +
        `  vec3 pos = raymarch(ro, rd, steps, hit);\n` +
        `  vec3 col = vec3(0.0);\n` +
        `  float fog = 0.0;\n` +
        `  if (hit.x < MAX_DIST) {\n` +
        `    vec3 normal = getNormal(pos);\n` +
        `    vec3 lightDir = normalize(vec3(0.5, 0.8, -0.6));\n` +
        `    float diff = max(dot(normal, lightDir), 0.0);\n` +
        `    float shadow = softShadow(pos + normal * SURF_DIST * 2.0, lightDir);\n` +
        `    float spec = pow(max(dot(reflect(-lightDir, normal), -rd), 0.0), 16.0);\n` +
        `    float accent = clamp(uAudio.x * 2.5 + uAudio.z, 0.0, 1.0);\n` +
        `    col = palette(hit.y, accent) * (0.2 + diff * shadow) + spec * 0.6;\n` +
        `    col += 0.15 * vec3(0.2, 0.5, 1.0) * (1.0 - shadow) * pow(diff, 4.0);\n` +
        `    fog = exp(-0.02 * hit.x * hit.x);\n` +
        `  } else {\n` +
        `    col = vec3(0.02, 0.04, 0.08);\n` +
        `  }\n` +
        `  vec3 nebula = vec3(0.05, 0.1, 0.2) + 0.25 * vec3(uAudio.z, uAudio.y, uAudio.x) * sin(uTime + rd.y * 5.0);\n` +
        `  col = mix(nebula, col, fog);\n` +
        `  col = pow(col, vec3(0.4545));\n` +
        `  fragColor = vec4(col, 1.0);\n` +
        `}`;

      function compileShader(type, source) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          const message = gl.getShaderInfoLog(shader);
          gl.deleteShader(shader);
          throw new Error(message);
        }
        return shader;
      }

      function createProgram(vs, fs) {
        const vertexShader = compileShader(gl.VERTEX_SHADER, vs);
        const fragmentShader = compileShader(gl.FRAGMENT_SHADER, fs);
        const program = gl.createProgram();
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
          throw new Error(gl.getProgramInfoLog(program));
        }
        gl.deleteShader(vertexShader);
        gl.deleteShader(fragmentShader);
        return program;
      }

      const program = createProgram(vsSource, fsSource);
      gl.useProgram(program);

      const positionBuffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.bufferData(
        gl.ARRAY_BUFFER,
        new Float32Array([
          -1, -1,
          3, -1,
          -1, 3,
        ]),
        gl.STATIC_DRAW
      );

      const vao = gl.createVertexArray();
      gl.bindVertexArray(vao);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

      const uniforms = {
        resolution: gl.getUniformLocation(program, 'uResolution'),
        time: gl.getUniformLocation(program, 'uTime'),
        cameraPos: gl.getUniformLocation(program, 'uCameraPos'),
        cameraMatrix: gl.getUniformLocation(program, 'uCameraMatrix'),
        audio: gl.getUniformLocation(program, 'uAudio'),
      };

      function vecSub(a, b) {
        return [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
      }
      function vecCross(a, b) {
        return [
          a[1] * b[2] - a[2] * b[1],
          a[2] * b[0] - a[0] * b[2],
          a[0] * b[1] - a[1] * b[0],
        ];
      }
      function vecNormalize(v) {
        const len = Math.hypot(v[0], v[1], v[2]) || 1;
        return [v[0] / len, v[1] / len, v[2] / len];
      }
      function cameraBasis(eye, target) {
        const forward = vecNormalize(vecSub(target, eye));
        const right = vecNormalize(vecCross(forward, [0, 1, 0]));
        const up = vecCross(right, forward);
        return { forward, right, up };
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function updateAudioLevels() {
        if (!state.analyser || !state.freqData) {
          state.audioLevels.fill(0);
          return;
        }
        state.analyser.getByteFrequencyData(state.freqData);
        const third = state.freqData.length / 3;
        let low = 0, mid = 0, high = 0;
        for (let i = 0; i < state.freqData.length; i++) {
          if (i < third) {
            low += state.freqData[i];
          } else if (i < third * 2) {
            mid += state.freqData[i];
          } else {
            high += state.freqData[i];
          }
        }
        const normalize = (sum, bins) => (sum / (bins * 255));
        const tLow = normalize(low, third);
        const tMid = normalize(mid, third);
        const tHigh = normalize(high, third);
        state.audioLevels[0] = lerp(state.audioLevels[0], tLow, 0.2);
        state.audioLevels[1] = lerp(state.audioLevels[1], tMid, 0.2);
        state.audioLevels[2] = lerp(state.audioLevels[2], tHigh, 0.2);
      }

      async function initAudio() {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) {
          throw new Error('Web Audio API unavailable');
        }
        const audioCtx = new AudioCtx();
        await audioCtx.resume();
        const masterGain = audioCtx.createGain();
        masterGain.gain.value = 0.35;

        const analyser = audioCtx.createAnalyser();
        analyser.fftSize = 512;

        masterGain.connect(analyser);
        analyser.connect(audioCtx.destination);

        // Bass voice
        const bassOsc = audioCtx.createOscillator();
        bassOsc.type = 'sawtooth';
        const bassGain = audioCtx.createGain();
        bassGain.gain.value = 0.23;
        bassOsc.frequency.value = 55;
        bassOsc.connect(bassGain).connect(masterGain);

        const bassLfo = audioCtx.createOscillator();
        bassLfo.frequency.value = 0.35;
        const bassLfoGain = audioCtx.createGain();
        bassLfoGain.gain.value = 30;
        bassLfo.connect(bassLfoGain).connect(bassOsc.frequency);

        // Lead voice
        const leadOsc = audioCtx.createOscillator();
        leadOsc.type = 'triangle';
        const leadGain = audioCtx.createGain();
        leadGain.gain.value = 0.08;
        leadOsc.connect(leadGain).connect(masterGain);
        leadOsc.frequency.value = 220;

        // Noise wash
        const noiseBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
        const noiseData = noiseBuffer.getChannelData(0);
        for (let i = 0; i < noiseData.length; i++) {
          noiseData[i] = Math.random() * 2 - 1;
        }
        const noiseSource = audioCtx.createBufferSource();
        noiseSource.buffer = noiseBuffer;
        noiseSource.loop = true;
        const noiseFilter = audioCtx.createBiquadFilter();
        noiseFilter.type = 'bandpass';
        noiseFilter.frequency.value = 500;
        noiseFilter.Q.value = 0.7;
        const noiseGain = audioCtx.createGain();
        noiseGain.gain.value = 0.05;
        noiseSource.connect(noiseFilter).connect(noiseGain).connect(masterGain);

        const notes = [0, 3, 7, 10, 12, 15, 19, 22];
        let noteIndex = 0;
        const melodyTimer = setInterval(() => {
          const semitone = notes[noteIndex % notes.length];
          const freq = 220 * Math.pow(2, semitone / 12);
          leadOsc.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.05);
          const bassFreq = 55 * Math.pow(2, (semitone % 12) / 12);
          bassOsc.frequency.setTargetAtTime(bassFreq * 0.5, audioCtx.currentTime, 0.2);
          noteIndex++;
        }, 600);

        bassOsc.start();
        bassLfo.start();
        leadOsc.start();
        noiseSource.start();

        state.audioCtx = audioCtx;
        state.melodyTimer = melodyTimer;
        return { analyser };
      }

      function updateStatus(msg) {
        statusEl.textContent = msg;
      }

      async function startDemo() {
        if (state.running) return;
        updateStatus('Starting audio...');
        try {
          const audio = await initAudio();
          state.analyser = audio.analyser;
          state.freqData = new Uint8Array(state.analyser.frequencyBinCount);
        } catch (err) {
          updateStatus(err.message);
          throw err;
        }
        state.startTime = performance.now();
        state.running = true;
        document.body.classList.add('started');
        updateStatus('');
        requestAnimationFrame(render);
      }

      function render(now) {
        if (!state.running) return;
        const elapsed = (now - state.startTime) * 0.001;
        resize();
        updateAudioLevels();
        const radius = 6.0 + Math.sin(elapsed * 0.3) * 2.0;
        const camPos = [
          Math.cos(elapsed * 0.25) * radius,
          1.5 + Math.sin(elapsed * 0.6) * 0.8 + state.audioLevels[0] * 2.0,
          Math.sin(elapsed * 0.25) * radius,
        ];
        const target = [
          Math.sin(elapsed * 0.2) * 1.0,
          0.2 + Math.sin(elapsed * 0.4) * 0.5,
          Math.cos(elapsed * 0.3) * 1.0,
        ];
        const { forward, right, up } = cameraBasis(camPos, target);
        gl.useProgram(program);
        gl.bindVertexArray(vao);
        gl.uniform2f(uniforms.resolution, canvas.width, canvas.height);
        gl.uniform1f(uniforms.time, elapsed);
        gl.uniform3fv(uniforms.cameraPos, camPos);
        gl.uniformMatrix3fv(uniforms.cameraMatrix, false, new Float32Array([
          right[0], right[1], right[2],
          up[0], up[1], up[2],
          forward[0], forward[1], forward[2],
        ]));
        gl.uniform3fv(uniforms.audio, state.audioLevels);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        requestAnimationFrame(render);
      }

      startBtn.addEventListener('click', async () => {
        startBtn.disabled = true;
        startBtn.textContent = 'Loading...';
        try {
          await startDemo();
        } catch (err) {
          console.error(err);
          startBtn.disabled = false;
          startBtn.textContent = 'Tap to retry';
        }
      });

      updateStatus('WebGL ready. Tap to begin.');
    </script>
  </body>
</html>
