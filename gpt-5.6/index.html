    :root {
      color-scheme: dark;
      --ink: #050507;
      --bone: #eee9dc;
      --ember: #ff4938;
      --aqua: #5de7df;
      --muted: rgba(238,233,220,.52);
      --hair: rgba(238,233,220,.22);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--ink);
      color: var(--bone);
      font-family: "Axiom Mono", ui-monospace, monospace;
      letter-spacing: 0;
    }

    body {
      touch-action: manipulation;
      user-select: none;
    }

    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: #050507;
    }

    .boot {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: minmax(22px, 7vw) minmax(0, 1fr) minmax(22px, 7vw);
      grid-template-rows: minmax(28px, 8vh) 1fr minmax(28px, 8vh);
      opacity: 1;
      visibility: visible;
      transition: opacity .9s ease, visibility .9s step-start;
      background: linear-gradient(90deg,
        transparent calc(7vw - 1px), rgba(238,233,220,.12) 7vw,
        transparent calc(7vw + 1px), transparent calc(93vw - 1px),
        rgba(238,233,220,.12) 93vw, transparent calc(93vw + 1px));
    }

    .boot::after {
      content: "";
      position: absolute;
      left: 7vw;
      right: 7vw;
      top: 8vh;
      height: 1px;
      background: var(--hair);
    }

    .boot.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .9s ease, visibility 0s .9s;
    }

    .boot-meta {
      grid-column: 2;
      grid-row: 1;
      align-self: end;
      display: flex;
      justify-content: space-between;
      padding-bottom: 12px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .boot-main {
      grid-column: 2;
      grid-row: 2;
      align-self: center;
      max-width: 980px;
      padding: 4vh 0;
    }

    .kicker {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: clamp(20px, 4vh, 46px);
      color: var(--ember);
      font-size: clamp(9px, .75vw, 12px);
      font-weight: 800;
      letter-spacing: .25em;
      text-transform: uppercase;
    }

    .kicker::before {
      content: "";
      width: 42px;
      height: 2px;
      background: currentColor;
      box-shadow: 49px 0 0 -0.5px currentColor;
    }

    h1 {
      margin: 0;
      font-size: clamp(58px, 13vw, 188px);
      font-weight: 900;
      line-height: .76;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1 span {
      display: block;
      color: transparent;
      -webkit-text-stroke: 1px var(--bone);
      text-stroke: 1px var(--bone);
    }

    .boot-action {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-top: clamp(34px, 7vh, 74px);
    }

    .launch {
      width: 58px;
      height: 58px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 1px solid rgba(238,233,220,.72);
      border-radius: 2px;
      background: rgba(5,5,7,.42);
      color: var(--bone);
      cursor: pointer;
      transition: color .2s ease, background .2s ease, border-color .2s ease;
    }

    .launch:hover,
    .launch:focus-visible {
      color: var(--ink);
      background: var(--bone);
      border-color: var(--bone);
      outline: none;
    }

    .launch svg { width: 19px; height: 19px; }

    .launch-copy strong {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .launch-copy span {
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .boot-foot {
      grid-column: 2;
      grid-row: 3;
      align-self: start;
      display: flex;
      justify-content: space-between;
      padding-top: 12px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .hud {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      opacity: 0;
      transition: opacity .8s ease;
    }

    body.running .hud { opacity: 1; }

    .brand {
      position: absolute;
      top: max(20px, env(safe-area-inset-top));
      left: max(20px, env(safe-area-inset-left));
      display: flex;
      align-items: center;
      gap: 11px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .brand-mark {
      width: 18px;
      height: 18px;
      border: 1px solid rgba(238,233,220,.8);
      transform: rotate(45deg);
      position: relative;
    }

    .brand-mark::after {
      content: "";
      position: absolute;
      inset: 5px;
      background: var(--ember);
    }

    .chapter {
      position: absolute;
      top: max(20px, env(safe-area-inset-top));
      right: max(20px, env(safe-area-inset-right));
      display: grid;
      grid-template-columns: auto auto;
      gap: 9px 14px;
      min-width: 176px;
      text-align: right;
      text-transform: uppercase;
    }

    .chapter-index {
      grid-row: 1 / span 2;
      color: var(--ember);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .12em;
    }

    .chapter-name {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .17em;
    }

    .chapter-time {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .12em;
    }

    .caption {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(82vw, 1080px);
      transform: translate(-50%, -42%);
      text-align: center;
      opacity: 0;
      transition: opacity .8s ease, transform 1.2s cubic-bezier(.16,1,.3,1);
      text-transform: uppercase;
    }

    .caption.visible {
      opacity: 1;
      transform: translate(-50%, -50%);
    }

    .caption-main {
      font-size: clamp(28px, 7vw, 96px);
      font-weight: 900;
      line-height: .92;
      letter-spacing: .03em;
      text-shadow: 0 2px 12px rgba(0,0,0,.92), 0 0 34px rgba(0,0,0,.74);
    }

    .caption-main span {
      display: block;
      white-space: nowrap;
    }

    .caption-sub {
      margin-top: 16px;
      color: rgba(238,233,220,.72);
      font-size: clamp(8px, .8vw, 12px);
      font-weight: 700;
      letter-spacing: .22em;
      line-height: 1.5;
      text-shadow: 0 1px 8px rgba(0,0,0,.95);
    }

    .signal-readout {
      position: absolute;
      left: max(20px, env(safe-area-inset-left));
      bottom: max(24px, env(safe-area-inset-bottom));
      display: flex;
      align-items: flex-end;
      gap: 14px;
      color: var(--muted);
      font-size: 8px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .meter {
      display: flex;
      align-items: end;
      gap: 2px;
      height: 18px;
    }

    .meter i {
      display: block;
      width: 2px;
      height: 4px;
      background: var(--bone);
      opacity: .28;
      transform-origin: bottom;
    }

    .progress {
      position: fixed;
      z-index: 8;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 2px;
      background: rgba(238,233,220,.12);
      opacity: 0;
      pointer-events: none;
      transition: opacity .5s ease;
    }

    body.running .progress { opacity: 1; }

    .progress span {
      display: block;
      width: 100%;
      height: 100%;
      background: var(--ember);
      transform: scaleX(0);
      transform-origin: left;
      will-change: transform;
    }

    .controls {
      position: fixed;
      z-index: 10;
      right: max(18px, env(safe-area-inset-right));
      bottom: max(20px, env(safe-area-inset-bottom));
      display: flex;
      gap: 6px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .35s ease;
    }

    body.running.controls-awake .controls {
      opacity: 1;
      pointer-events: auto;
    }

    .icon-button {
      width: 44px;
      height: 44px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 1px solid rgba(238,233,220,.25);
      border-radius: 2px;
      background: rgba(5,5,7,.54);
      color: var(--bone);
      backdrop-filter: blur(8px);
      cursor: pointer;
    }

    .icon-button:hover,
    .icon-button:focus-visible {
      border-color: rgba(238,233,220,.8);
      background: rgba(238,233,220,.1);
      outline: none;
    }

    .icon-button svg { width: 16px; height: 16px; }

    .fatal {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: none;
      place-items: center;
      padding: 10vw;
      background: #050507;
      color: var(--bone);
      font: 600 13px/1.6 ui-monospace, monospace;
      white-space: pre-wrap;
    }

    .fatal.visible { display: grid; }

    @media (max-width: 640px) {
      .boot {
        grid-template-columns: 22px minmax(0, 1fr) 22px;
        background: linear-gradient(90deg,
          transparent 21px, rgba(238,233,220,.12) 22px,
          transparent 23px, transparent calc(100vw - 23px),
          rgba(238,233,220,.12) calc(100vw - 22px),
          transparent calc(100vw - 21px));
      }
      .boot::after { left: 22px; right: 22px; }
      .boot-meta span:last-child, .boot-foot span:last-child { display: none; }
      .boot-main { padding-bottom: 10vh; }
      h1 { font-size: clamp(56px, 22vw, 110px); line-height: .8; }
      .launch { width: 54px; height: 54px; }
      .brand span { display: none; }
      .chapter { min-width: 142px; }
      .caption { width: calc(100vw - 32px); }
      .caption-main { font-size: clamp(26px, 10.5vw, 48px); }
      .caption-sub { font-size: 9px; line-height: 1.6; }
      .signal-readout { display: none; }
      .controls {
        right: max(12px, env(safe-area-inset-right));
        bottom: max(14px, env(safe-area-inset-bottom));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .boot, .hud, .caption, .controls { transition-duration: .01s; }
    }
  </style>
</head>

  <pre class="fatal" id="fatal"></pre>

  <script id="vs-full" type="x-shader/x-vertex">#version 300 es
precision highp float;
out vec2 vUv;
void main() {
  vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
  vUv = p;
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}</script>

  <script id="fs-main" type="x-shader/x-fragment">#version 300 es
precision highp float;
out vec4 fragColor;
uniform vec2 uResolution;
uniform vec2 uPointer;
uniform float uTime;
uniform float uLocal;
uniform float uKick;
uniform float uSnare;
uniform float uEnergy;
uniform float uCut;
uniform int uScene;

#define PI 3.14159265359
#define TAU 6.28318530718

mat2 rot(float a) {
  float c = cos(a), s = sin(a);
  return mat2(c, -s, s, c);
}

float hash11(float p) {
  p = fract(p * .1031);
  p *= p + 33.33;
  p *= p + p;
  return fract(p);
}

float hash21(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * vec3(.1031, .1030, .0973));
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

float hash31(vec3 p) {
  p = fract(p * .1031);
  p += dot(p, p.zyx + 31.32);
  return fract((p.x + p.y) * p.z);
}

float noise3(vec3 p) {
  vec3 i = floor(p);
  vec3 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(
    mix(mix(hash31(i), hash31(i + vec3(1,0,0)), f.x),
        mix(hash31(i + vec3(0,1,0)), hash31(i + vec3(1,1,0)), f.x), f.y),
    mix(mix(hash31(i + vec3(0,0,1)), hash31(i + vec3(1,0,1)), f.x),
        mix(hash31(i + vec3(0,1,1)), hash31(i + vec3(1,1,1)), f.x), f.y), f.z);
}

float fbm(vec3 p) {
  float f = 0.0;
  float a = .5;
  mat3 m = mat3(.00,.80,.60, -.80,.36,-.48, -.60,-.48,.64);
  for (int i = 0; i < 4; i++) {
    f += a * noise3(p);
    p = m * p * 2.03 + 1.7;
    a *= .5;
  }
  return f;
}

float sdBox(vec3 p, vec3 b) {
  vec3 q = abs(p) - b;
  return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0);
}

float sdTorus(vec3 p, vec2 t) {
  vec2 q = vec2(length(p.xz) - t.x, p.y);
  return length(q) - t.y;
}

float gyroid(vec3 p) {
  return dot(sin(p), cos(p.zxy)) / 1.5;
}

vec3 envColor(vec3 d) {
  float h = max(d.y * .5 + .5, 0.0);
  vec3 c = mix(vec3(.006,.007,.011), vec3(.12,.115,.105), pow(h, 5.0));
  c += vec3(1.0,.18,.08) * pow(max(0.0, 1.0 - abs(d.y + .14) * 16.0), 12.0) * .55;
  c += vec3(.18,.75,.72) * pow(max(0.0, d.x * .5 + .2), 18.0) * .2;
  return c;
}

vec3 cameraRay(vec2 uv, vec3 ro, vec3 ta, float lens) {
  vec3 f = normalize(ta - ro);
  vec3 r = normalize(cross(vec3(0,1,0), f));
  vec3 u = cross(f, r);
  return normalize(f * lens + uv.x * r + uv.y * u);
}

vec3 renderSignal(vec2 uv) {
  vec3 col = vec3(.0035,.0038,.006);
  vec2 g = floor((uv + 4.0) * 82.0);
  float dust = step(.992, hash21(g)) * hash21(g + 7.1);
  col += vec3(.72,.71,.66) * dust * (.2 + .8 * hash21(g + 2.));

  float travel = fract(uTime * .092);
  float px = mix(-1.55, 1.55, travel);
  float pulse = exp(-abs(uv.x - px) * 35.0);
  float line = exp(-abs(uv.y) * (170.0 - uKick * 75.0));
  float waveform = sin(uv.x * 92.0 + uTime * 8.0) * .008 * (smoothstep(2.0, 8.0, uLocal));
  line += exp(-abs(uv.y - waveform) * 280.0) * .5;
  col += vec3(.82,.79,.70) * line * (.12 + .88 * pulse);
  col += vec3(1.0,.055,.018) * pulse * exp(-abs(uv.y) * 35.0) * 1.7;

  float grow = smoothstep(4.0, 14.0, uLocal);
  vec2 q = uv;
  q *= rot(-uTime * .04);
  float r = length(q);
  float disc = smoothstep(.32 * grow + .015, .30 * grow, r);
  float rim = exp(-abs(r - .31 * grow) * 95.0);
  float ring = exp(-abs(length(q * vec2(1.0, 2.8)) - .52 * grow) * 75.0);
  col *= 1.0 - disc * .96;
  col += vec3(.95,.91,.82) * rim * .72;
  col += vec3(1.0,.07,.025) * ring * (.5 + uKick);
  col += vec3(.14,.75,.72) * exp(-r * 13.0) * grow * .24;

  float ticks = step(.96, sin(atan(q.y,q.x) * 24.0)) * exp(-abs(r - .43) * 120.0);
  col += vec3(.7,.68,.62) * ticks * grow * .3;
  return col;
}

float mapCore(vec3 p) {
  p.yz *= rot(.18 * sin(uTime * .17));
  p.xz *= rot(uTime * .13);
  float open = .14 * sin(uTime * .35) + .16 * uKick;
  vec3 q = p;
  q.xy *= rot(.45 * sin(uTime * .21));
  float sphere = length(q) - 1.34;
  float g = abs(gyroid(q * (3.8 + open))) / (3.8 + open) - .035;
  float shell = max(sphere, g);
  vec3 s = q;
  s.xy *= rot(PI * .25);
  float slabs = sdBox(s, vec3(1.48,.055 + open * .08,1.48));
  float tor = sdTorus(q, vec2(1.08,.035 + .018 * uKick));
  return min(shell, min(slabs, tor));
}

vec3 normalCore(vec3 p) {
  vec2 e=vec2(.0025,-.0025);
  return normalize(
    e.xyy*mapCore(p+e.xyy)+e.yyx*mapCore(p+e.yyx)+
    e.yxy*mapCore(p+e.yxy)+e.xxx*mapCore(p+e.xxx));
}

vec3 renderCore(vec2 uv) {
  float orbit = uTime * .12 + uPointer.x * .22;
  vec3 ro = vec3(3.15 * sin(orbit), .55 + .28 * sin(uTime * .16), 3.15 * cos(orbit));
  float aspect=uResolution.x/uResolution.y;
  float lens=mix(.9,1.65,smoothstep(.5,1.6,aspect));
  vec3 rd = cameraRay(uv, ro, vec3(0), lens);
  float t = 0.0;
  float glow = 0.0;
  float hit = 0.0;
  vec3 p = ro;
  for (int i = 0; i < 76; i++) {
    p = ro + rd * t;
    float d = mapCore(p);
    glow += exp(-abs(d) * 36.0) * .0035;
    if (d < .0015) { hit = 1.0; break; }
    t += d * .72;
    if (t > 8.0) break;
  }

  vec3 col = envColor(rd) * .28;
  if (hit > .5) {
    vec3 n = normalCore(p);
    vec3 l1 = normalize(vec3(-.6,.8,.35));
    vec3 l2 = normalize(vec3(.55,-.2,-.8));
    float dif = max(dot(n,l1),0.0);
    float edge = pow(1.0 - max(dot(n,-rd),0.0), 3.0);
    float gy = abs(gyroid(p * 3.8));
    float seam = exp(-gy * 8.0);
    vec3 refl = envColor(reflect(rd,n));
    col = vec3(.008,.009,.012) + refl * (.58 + .35 * edge);
    col += vec3(.92,.86,.72) * dif * .25;
    col += vec3(1.0,.025,.008) * seam * (1.2 + uKick * 2.0);
    col += vec3(.17,.8,.72) * edge * edge * .28;
  }
  col += vec3(1.0,.04,.012) * glow * (1.0 + uKick * 3.0);
  col *= exp(-t * .035);
  return col;
}

float mapNave(vec3 p) {
  vec3 q = p;
  q.z = mod(q.z + 2.0, 4.0) - 2.0;
  float side = sdBox(vec3(abs(q.x) - 2.38, q.y, q.z), vec3(.14, 1.65, .16));
  float roof = sdBox(vec3(q.x, q.y - 1.56, q.z), vec3(2.52,.12,.16));
  float brace = sdBox(vec3(abs(q.x) - 1.68, q.y - .95, q.z), vec3(.10,.72,.13));
  float floorD = p.y + 1.12;
  float rails = sdBox(vec3(abs(p.x) - .62, p.y + 1.02, q.z), vec3(.035,.06,1.75));
  float walls = abs(abs(p.x) - 2.75) - .045;
  return min(min(min(side, roof), brace), min(floorD, min(rails,walls)));
}

vec3 normalNave(vec3 p) {
  vec2 e=vec2(.003,-.003);
  return normalize(
    e.xyy*mapNave(p+e.xyy)+e.yyx*mapNave(p+e.yyx)+
    e.yxy*mapNave(p+e.yxy)+e.xxx*mapNave(p+e.xxx));
}

vec3 renderNave(vec2 uv) {
  float speed = 1.6 + .5 * uEnergy;
  vec3 ro = vec3(.18 * sin(uTime * .28), -.16 + .05*sin(uTime), uTime * speed);
  vec3 ta = ro + vec3(.1*sin(uTime*.17), .02, 4.0);
  vec3 rd = cameraRay(uv,ro,ta,1.55);
  float t = 0.0, hit = 0.0, laneGlow = 0.0;
  vec3 p = ro;
  for (int i=0;i<74;i++) {
    p = ro + rd*t;
    float d = mapNave(p);
    laneGlow += exp(-abs(d)*22.0) * .0016;
    if (d < .0018) {hit=1.0;break;}
    t += d * .76;
    if (t>30.0) break;
  }
  vec3 col = vec3(.003,.004,.006);
  if (hit>.5) {
    vec3 n=normalNave(p);
    vec3 q=p; q.z=mod(q.z+2.,4.)-2.;
    float strip=exp(-abs(abs(p.x)-2.68)*35.0)*(.25+.75*step(0.0,sin(p.z*PI*.5)));
    float rail=exp(-abs(abs(p.x)-.62)*45.0)*exp(-abs(p.y+1.04)*55.0);
    float panel=step(.55,hash21(floor(p.yz*vec2(2.,.5))))*.18;
    float diff=max(dot(n,normalize(vec3(-.4,.75,-.45))),0.);
    float fres=pow(1.-max(dot(n,-rd),0.),3.);
    col=vec3(.012,.013,.016)+vec3(.72,.69,.61)*diff*.22;
    col+=envColor(reflect(rd,n))*.3*fres;
    col+=vec3(1.0,.035,.01)*(strip*2.1+rail*(1.2+uKick*1.8));
    col+=vec3(.12,.75,.7)*panel;
    if (p.y < -1.05) {
      float grid=exp(-abs(fract(p.z*.25)-.5)*70.)+exp(-abs(fract(p.x*.8)-.5)*70.);
      col+=vec3(.75,.7,.61)*grid*.055;
    }
  }
  float center=exp(-length(uv*vec2(.75,1.))*6.0);
  col+=vec3(1.0,.035,.012)*center*(.08+.22*uKick);
  col+=vec3(1.0,.04,.015)*laneGlow;
  col=mix(col,vec3(.008,.009,.012),1.-exp(-t*.035));
  return col;
}

vec3 renderInversion(vec2 uv) {
  vec3 ro=vec3(.2*sin(uTime*.17),.15*cos(uTime*.13),uTime*1.12);
  vec3 rd=cameraRay(uv,ro,ro+vec3(.08*sin(uTime*.31),.06*cos(uTime*.23),3.0),1.5);
  vec3 col=vec3(.002,.004,.006);
  float trans=1.0;
  float t=.1;
  for(int i=0;i<64;i++){
    vec3 p=ro+rd*t;
    p.xy*=rot(.13*p.z+uTime*.08);
    float g=abs(gyroid(p*2.05));
    float ridge=exp(-g*10.5);
    float wisps=fbm(p*.72+vec3(0,0,uTime*.1));
    float den=ridge*(.12+.24*wisps);
    vec3 a=vec3(1.0,.035,.014);
    vec3 b=vec3(.06,.82,.75);
    vec3 c=mix(a,b,.5+.5*sin(p.z*.42+p.x*2.2));
    c+=vec3(.75,.7,.58)*pow(ridge,5.0)*.3;
    col+=trans*den*c*.095;
    trans*=1.0-den*.085;
    t+=.075+.055*g;
    if(trans<.025||t>12.0)break;
  }
  float iris=exp(-abs(length(uv)-(.42+.12*sin(uTime*.2)))*18.0);
  col+=vec3(.12,.78,.73)*iris*.09;
  col*=.72+uEnergy*.42;
  return col;
}

float deCrystalRaw(vec3 p) {
  vec3 z=p;
  float dr=1.0;
  for(int i=0;i<5;i++){
    z=clamp(z,-1.0,1.0)*2.0-z;
    float r2=max(dot(z,z),.08);
    float k=clamp(1.25/r2,1.0,2.4);
    z*=k;
    dr*=k;
    z=z*1.62+p;
    dr=dr*1.62+1.0;
    z.xy*=rot(.17+float(i)*.09);
  }
  return length(z)/abs(dr)-.012;
}

float mapCrystal(vec3 p) {
  p.xz*=rot(uTime*.08);
  p.yz*=rot(.32*sin(uTime*.11));
  float de=deCrystalRaw(p);
  float bound=(abs(p.x)+abs(p.y)+abs(p.z)-2.05)*.57735027;
  return max(de,bound);
}

vec3 normalCrystal(vec3 p) {
  vec2 e=vec2(.0022,-.0022);
  return normalize(
    e.xyy*mapCrystal(p+e.xyy)+e.yyx*mapCrystal(p+e.yyx)+
    e.yxy*mapCrystal(p+e.yxy)+e.xxx*mapCrystal(p+e.xxx));
}

vec3 renderCrystal(vec2 uv) {
  float cut=floor(uLocal/7.5);
  float ang=uTime*.085+cut*1.37;
  float rad=mix(3.55,3.2,step(1.5,mod(cut,3.0)));
  vec3 ro=vec3(sin(ang)*rad,.45*sin(ang*.7)+.2,cos(ang)*rad);
  float aspect=uResolution.x/uResolution.y;
  float lens=mix(.74,1.42,smoothstep(.5,1.6,aspect));
  vec3 rd=cameraRay(uv,ro,vec3(0),lens);
  float t=0.,hit=0.,glow=0.;
  vec3 p=ro;
  for(int i=0;i<68;i++){
    p=ro+rd*t;
    float d=mapCrystal(p);
    glow+=exp(-abs(d)*28.)*.0015;
    if(d<.0015){hit=1.;break;}
    t+=d*.58;
    if(t>7.)break;
  }
  vec3 col=envColor(rd)*.16;
  if(hit>.5){
    vec3 n=normalCrystal(p);
    float fres=pow(1.-max(dot(n,-rd),0.),2.4);
    float facets=pow(abs(dot(n,normalize(vec3(.6,.7,-.35)))),2.);
    float trap=.5+.5*sin(length(p)*16.+atan(p.z,p.x)*4.);
    vec3 mineral=mix(vec3(.94,.86,.7),vec3(.05,.72,.7),trap);
    col=envColor(reflect(rd,n))*(.62+.4*fres);
    col+=mineral*facets*.72;
    col+=vec3(1.,.025,.008)*fres*(.55+uKick*1.8);
    col+=vec3(.018,.09,.085)*trap;

        [[0,78,5],[6,76,2],[10,74,3],[14,73,1]],
        [[0,76,2],[3,73,1],[4,71,4],[9,73,2],[12,76,3]],
        [[0,71,3],[4,68,2],[8,66,2],[11,68,1],[12,71,4]]
      ];
      const transitionBars = [8,24,40,56,72,88];
      const fillBars = [23,39,55,71,87];

      this.add(0, 0, "hit", { note: 30, vel: .68 });
      this.add(0, 0, "drone", { chord: chords[0], dur: BAR * 8, vel: .72 });

      for (let bar = 0; bar < TOTAL_BARS; bar++) {
        const chordIndex = bar % 4;
        const chord = chords[chordIndex];
        const root = roots[chordIndex];
        const active = bar >= 8 && bar < 92;
        const intense = (bar >= 24 && bar < 40) || (bar >= 48 && bar < 88);
        const breakdown = bar >= 40 && bar < 48;
        const resolve = bar >= 88;

        if (bar < 88 || bar % 2 === 0) {
          this.add(bar, 0, "pad", {
            chord: chord,
            dur: BAR * (resolve ? 1.8 : 1.12),
            vel: breakdown ? .82 : (resolve ? .68 : .48)
          });
        }

        if (transitionBars.indexOf(bar) !== -1) {
          this.add(bar, 0, "hit", { note: root, vel: 1 });
        }
        if (transitionBars.indexOf(bar + 1) !== -1) {
          this.add(bar, 0, "riser", { dur: BAR, vel: .7 });
        }

        if (active && !resolve) {
          const arpEvery = breakdown ? 2 : 1;
          for (let step = 0; step < 16; step += arpEvery) {
            const order = arpOrder[(step + bar * 3) % arpOrder.length] % chord.length;
            this.add(bar, step, "pluck", {
              note: chord[order] + (bar >= 56 ? 12 : 0),
              dur: STEP * (breakdown ? 1.55 : .72),
              vel: breakdown ? .45 : (intense ? .62 : .44)
            });
          }
        }

        let kicks = [];
        if (bar >= 8 && bar < 16) kicks = [0,8];
        else if (bar >= 16 && bar < 24) kicks = [0,4,8,12];
        else if (bar >= 24 && bar < 40) kicks = bar % 2 ? [0,4,7,8,12,14] : [0,4,8,12];
        else if (bar >= 48 && bar < 56) kicks = [0,4,8,12];
        else if (bar >= 56 && bar < 64) kicks = [0,3,6,8,11,14];
        else if (bar >= 64 && bar < 72) kicks = bar % 2 ? [0,4,7,8,12,14] : [0,4,8,12];
        else if (bar >= 72 && bar < 88) kicks = bar % 2 ? [0,3,6,8,11,14] : [0,4,7,8,12,14];
        else if (bar === 88) kicks = [0];

        kicks.forEach((step) => {
          const ghost = step === 7 || step === 14 || step === 3 || step === 11;
          this.add(bar, step, "kick", { vel: ghost ? .48 : .92, ghost: ghost });
        });

        if ((bar >= 16 && bar < 40) || (bar >= 48 && bar < 88)) {
          [4,12].forEach((step) => this.add(bar, step, "snare", { vel: .72 }));
          if (intense && bar % 2) this.add(bar, 10, "snare", { vel: .17, ghost: true });
        }

        if (fillBars.indexOf(bar) !== -1) {
          [8,10,12,13,14,15].forEach((step, index) => {
            this.add(bar, step, "snare", { vel: .18 + index * .1, fill: true });
          });
        }

        if ((bar >= 12 && bar < 40) || (bar >= 48 && bar < 88)) {
          const hats = intense ? [1,2,3,5,6,7,9,10,11,13,14,15] : [2,6,10,14];
          hats.forEach((step) => {
            this.add(bar, step, "hat", {
              vel: step % 4 === 2 ? .4 : .2,
              open: step === 14 && bar % 2 === 0
            });
          });
        }

        if ((bar >= 16 && bar < 40) || (bar >= 48 && bar < 88)) {
          bassPattern.forEach((item, index) => {
            if (bar % 4 === 3 && index === 1) return;
            this.add(bar, item[0], "bass", {
              note: root + item[1],
              dur: item[2] * STEP,
              vel: item[3] * (bar >= 72 ? 1 : .82)
            });
          });
        }

        const leadActive = (bar >= 32 && bar < 40) || (bar >= 48 && bar < 56) || (bar >= 72 && bar < 88);
        if (leadActive) {
          const phrase = lead[bar % 4];
          phrase.forEach((item) => {
            let note = item[1];
            if (bar >= 72) note += 12;
            this.add(bar, item[0], "lead", {
              note: note,
              dur: item[2] * STEP,
              vel: bar >= 72 ? .66 : .46
            });
          });
        }

        if (bar >= 72 && bar < 88) {
          for (let step = 0; step < 16; step += 2) {
            const index = arpOrder[(15 - step + bar) & 15] % chord.length;
            this.add(bar, step, "pluck", {
              note: chord[index] + 24,
              dur: STEP * 1.1,
              vel: .24
            });
          }
        }
      }

      this.add(95, 8, "hit", { note: 30, vel: .9 });
    }

    pulse(type, time, decay) {
      const list = this.times[type];
      if (!list || !Number.isFinite(decay) || decay <= 0) {
        throw new Error("Invalid visual pulse request for " + type + ".");
      }
      let lo = 0;
      let hi = list.length - 1;
      let found = -Infinity;
      while (lo <= hi) {
        const mid = (lo + hi) >> 1;
        if (list[mid] <= time) {
          found = list[mid];
          lo = mid + 1;
        } else {
          hi = mid - 1;
        }
      }
      return found > -Infinity ? Math.exp(-(time - found) / decay) : 0;
    }
  }

  class AudioEngine {
    constructor(score, onFatal) {
      if (typeof onFatal !== "function") throw new Error("AudioEngine requires a fatal error handler.");
      this.score = score;
      this.onFatal = onFatal;
      this.ctx = null;
      this.startAt = 0;
      this.index = 0;
      this.timer = 0;
      this.muted = false;
      this.paused = false;
      this.seed = 0x6d2b79f5;
    }

    random() {
      let x = this.seed | 0;
      x ^= x << 13;
      x ^= x >>> 17;
      x ^= x << 5;
      this.seed = x | 0;
      return (x >>> 0) / 4294967296;
    }

    async start(muted) {
      if (this.ctx) await this.stop();
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) throw new Error("Web Audio is required for the soundtrack.");
      this.seed = 0x6d2b79f5;
      this.paused = false;
      this.ctx = new AudioContextClass({ latencyHint: "interactive" });
      await this.ctx.resume();
      this.setupGraph();
      this.index = 0;
      this.startAt = this.ctx.currentTime + .12;
      this.muted = !!muted;
      this.master.gain.setValueAtTime(this.muted ? 0 : .72, this.ctx.currentTime);
      this.scheduler();
      this.timer = setInterval(() => {
        try {
          this.scheduler();
        } catch (error) {
          clearInterval(this.timer);
          this.timer = 0;
          const detail = error && error.message ? error.message : String(error);
          this.onFatal(new Error("Audio scheduler failed: " + detail));
        }
      }, 25);
    }

    setupGraph() {
      const ctx = this.ctx;
      this.drumBus = ctx.createGain();
      this.musicBus = ctx.createGain();
      this.duck = ctx.createGain();
      this.mix = ctx.createGain();
      this.reverbSend = ctx.createGain();
      this.delaySend = ctx.createGain();
      this.musicBus.connect(this.duck).connect(this.mix);
      this.drumBus.connect(this.mix);

      this.noiseBuffer = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 2), ctx.sampleRate);
      const noise = this.noiseBuffer.getChannelData(0);
      for (let i = 0; i < noise.length; i++) noise[i] = this.random() * 2 - 1;

      const impulse = ctx.createBuffer(2, Math.floor(ctx.sampleRate * 2.35), ctx.sampleRate);
      for (let channel = 0; channel < 2; channel++) {
        const data = impulse.getChannelData(channel);
        for (let i = 0; i < data.length; i++) {
          const envelope = Math.pow(1 - i / data.length, 2.8);
          data[i] = (this.random() * 2 - 1) * envelope * (channel ? .88 : 1);
        }
      }

      const convolver = ctx.createConvolver();
      convolver.buffer = impulse;
      const reverbReturn = ctx.createGain();
      reverbReturn.gain.value = .22;
      this.reverbSend.connect(convolver).connect(reverbReturn).connect(this.mix);

      const delay = ctx.createDelay(1);
      delay.delayTime.value = BEAT * .75;
      const feedback = ctx.createGain();
      feedback.gain.value = .31;
      const delayReturn = ctx.createGain();
      delayReturn.gain.value = .26;
      this.delaySend.connect(delay);
      delay.connect(feedback).connect(delay);
      delay.connect(delayReturn).connect(this.mix);

      const highpass = ctx.createBiquadFilter();
      highpass.type = "highpass";
      highpass.frequency.value = 24;
      highpass.Q.value = .7;

      const drive = ctx.createWaveShaper();
      const curve = new Float32Array(2048);
      for (let i = 0; i < curve.length; i++) {
        const x = i * 2 / (curve.length - 1) - 1;
        curve[i] = Math.tanh(x * 1.35);
      }
      drive.curve = curve;
      drive.oversample = "2x";

      const compressor = ctx.createDynamicsCompressor();
      compressor.threshold.value = -11;
      compressor.knee.value = 12;
      compressor.ratio.value = 3;
      compressor.attack.value = .003;
      compressor.release.value = .18;

      this.analyser = ctx.createAnalyser();
      this.analyser.fftSize = 1024;
      this.analyser.smoothingTimeConstant = .72;
      this.spectrum = new Uint8Array(this.analyser.frequencyBinCount);
      this.master = ctx.createGain();
      this.master.gain.value = .72;
      this.mix.connect(highpass).connect(drive).connect(compressor).connect(this.analyser).connect(this.master).connect(ctx.destination);
    }

    route(node, destination, reverb, delay) {
      node.connect(destination);
      if (reverb > 0) {
        const send = this.ctx.createGain();
        send.gain.value = reverb;
        node.connect(send).connect(this.reverbSend);
      }
      if (delay > 0) {
        const send = this.ctx.createGain();
        send.gain.value = delay;
        node.connect(send).connect(this.delaySend);
      }
    }

    envelope(gain, time, attack, duration, level) {
      const end = time + Math.max(duration, attack + .012);
      gain.cancelScheduledValues(time);
      gain.setValueAtTime(.0001, time);
      gain.linearRampToValueAtTime(level, time + attack);
      gain.exponentialRampToValueAtTime(.0001, end);
      return end;
    }

    oscillator(type, frequency, detune) {
      const oscillator = this.ctx.createOscillator();
      oscillator.type = type;
      oscillator.frequency.value = frequency;
      oscillator.detune.value = detune || 0;
      return oscillator;
    }

    noiseSource() {
      const source = this.ctx.createBufferSource();
      source.buffer = this.noiseBuffer;
      return source;
    }

    kick(event, time) {
      const ctx = this.ctx;
      const gain = ctx.createGain();
      const osc = this.oscillator("sine", 155, 0);
      osc.frequency.setValueAtTime(155, time);
      osc.frequency.exponentialRampToValueAtTime(47, time + .105);
      const end = this.envelope(gain.gain, time, .002, .34, .72 * event.vel);
      osc.connect(gain);
      this.route(gain, this.drumBus, 0, 0);
      osc.start(time);
      osc.stop(end + .03);

      const click = this.noiseSource();
      const hp = ctx.createBiquadFilter();
      const cg = ctx.createGain();
      hp.type = "highpass";
      hp.frequency.value = 4200;
      this.envelope(cg.gain, time, .001, .018, .06 * event.vel);
      click.connect(hp).connect(cg).connect(this.drumBus);
      click.start(time, this.random() * 1.7, .025);

      if (!event.ghost) {
        this.duck.gain.cancelScheduledValues(time);
        this.duck.gain.setValueAtTime(1, time);
        this.duck.gain.linearRampToValueAtTime(.58, time + .006);
        this.duck.gain.exponentialRampToValueAtTime(1, time + .16);
      }
    }

    snare(event, time) {
      const ctx = this.ctx;
      const source = this.noiseSource();
      const band = ctx.createBiquadFilter();
      const high = ctx.createBiquadFilter();
      const gain = ctx.createGain();
      band.type = "bandpass";
      band.frequency.value = event.fill ? 2400 + event.vel * 1500 : 1850;
      band.Q.value = .72;
      high.type = "highpass";
      high.frequency.value = 620;
      const end = this.envelope(gain.gain, time, .002, event.ghost ? .09 : .19, .27 * event.vel);
      source.connect(high).connect(band).connect(gain);
      this.route(gain, this.drumBus, .12, .03);
      source.start(time, this.random() * 1.7, end - time + .02);

      if (!event.ghost) {
        const body = this.oscillator("triangle", 185, 0);
        const bodyGain = ctx.createGain();
        body.frequency.exponentialRampToValueAtTime(105, time + .08);
        const bodyEnd = this.envelope(bodyGain.gain, time, .001, .09, .08 * event.vel);
        body.connect(bodyGain).connect(this.drumBus);
        body.start(time);
        body.stop(bodyEnd + .02);
      }
    }

    hat(event, time) {
      const ctx = this.ctx;
      const source = this.noiseSource();
      const high = ctx.createBiquadFilter();
      const band = ctx.createBiquadFilter();
      const gain = ctx.createGain();
      high.type = "highpass";
      high.frequency.value = 6500;
      band.type = "bandpass";
      band.frequency.value = 9600;
      band.Q.value = .8;
      const duration = event.open ? .19 : .045;
      const end = this.envelope(gain.gain, time, .001, duration, .15 * event.vel);
      source.connect(high).connect(band).connect(gain);
      this.route(gain, this.drumBus, event.open ? .09 : .025, 0);
      source.start(time, this.random() * 1.7, end - time + .02);
    }

    bass(event, time) {
      const ctx = this.ctx;
      const filter = ctx.createBiquadFilter();
      const gain = ctx.createGain();
      const frequency = midi(event.note);
      filter.type = "lowpass";
      filter.Q.value = 6.5;
      filter.frequency.setValueAtTime(1800, time);
      filter.frequency.exponentialRampToValueAtTime(145, time + Math.min(.25, event.dur));
      const end = this.envelope(gain.gain, time, .006, event.dur, .17 * event.vel);
      [-5,5].forEach((detune, index) => {
        const osc = this.oscillator(index ? "square" : "sawtooth", frequency, detune);
        osc.connect(filter);
        osc.start(time);
        osc.stop(end + .03);
      });
      const sub = this.oscillator("sine", frequency * .5, 0);
      const subGain = ctx.createGain();
      subGain.gain.value = .22;
      sub.connect(subGain).connect(filter);
      sub.start(time);
      sub.stop(end + .03);
      filter.connect(gain);
      this.route(gain, this.musicBus, 0, 0);
    }

    pluck(event, time) {
      const ctx = this.ctx;
      const carrier = this.oscillator("sine", midi(event.note), 0);
      const modulator = this.oscillator("sine", midi(event.note) * 2.01, 0);
      const modGain = ctx.createGain();
      const gain = ctx.createGain();
      modGain.gain.setValueAtTime(820, time);
      modGain.gain.exponentialRampToValueAtTime(.01, time + .18);
      modulator.connect(modGain).connect(carrier.frequency);
      const end = this.envelope(gain.gain, time, .003, Math.max(.12, event.dur), .105 * event.vel);
      carrier.connect(gain);
      this.route(gain, this.musicBus, .12, .22);
      carrier.start(time);
      modulator.start(time);
      carrier.stop(end + .03);
      modulator.stop(end + .03);
    }

    pad(event, time) {
      const ctx = this.ctx;
      event.chord.forEach((note, noteIndex) => {
        const filter = ctx.createBiquadFilter();
        const gain = ctx.createGain();
        filter.type = "lowpass";
        filter.Q.value = 1.2;
        filter.frequency.setValueAtTime(420 + noteIndex * 45, time);
        filter.frequency.linearRampToValueAtTime(1300 + event.vel * 600, time + event.dur * .58);
        filter.frequency.linearRampToValueAtTime(560, time + event.dur);
        const end = this.envelope(gain.gain, time, Math.min(.65, event.dur * .34), event.dur, .018 * event.vel);
        [-8,0,8].forEach((detune) => {
          const osc = this.oscillator("sawtooth", midi(note), detune);
          osc.connect(filter);
          osc.start(time);
          osc.stop(end + .08);
        });
        filter.connect(gain);
        this.route(gain, this.musicBus, .2, .025);
      });
    }

    drone(event, time) {
      const ctx = this.ctx;
      event.chord.forEach((note, index) => {
        const osc = this.oscillator(index % 2 ? "triangle" : "sawtooth", midi(note - 12), index * 2 - 4);
        const filter = ctx.createBiquadFilter();
        const gain = ctx.createGain();
        filter.type = "lowpass";
        filter.Q.value = 4;
        filter.frequency.setValueAtTime(120, time);
        filter.frequency.exponentialRampToValueAtTime(1250, time + event.dur * .78);
        const end = this.envelope(gain.gain, time, 2.8, event.dur, .016 * event.vel);
        osc.connect(filter).connect(gain);
        this.route(gain, this.musicBus, .38, .06);
        osc.start(time);
        osc.stop(end + .1);
      });
    }

    lead(event, time) {
      const ctx = this.ctx;
      const filter = ctx.createBiquadFilter();
      const gain = ctx.createGain();
      filter.type = "lowpass";
      filter.frequency.value = 3200;
      filter.Q.value = 3;
      const end = this.envelope(gain.gain, time, .018, Math.max(.1, event.dur), .075 * event.vel);
      [-6,6].forEach((detune) => {
        const osc = this.oscillator("sawtooth", midi(event.note), detune);
        osc.connect(filter);
        osc.start(time);
        osc.stop(end + .05);
      });
      const body = this.oscillator("sine", midi(event.note - 12), 0);
      const bodyGain = ctx.createGain();
      bodyGain.gain.value = .12;
      body.connect(bodyGain).connect(filter);
      body.start(time);
      body.stop(end + .05);
      filter.connect(gain);
      this.route(gain, this.musicBus, .16, .18);
    }

    hit(event, time) {
      const ctx = this.ctx;
      const sub = this.oscillator("sine", 95, 0);
      const subGain = ctx.createGain();
      sub.frequency.exponentialRampToValueAtTime(Math.max(36, midi(event.note)), time + .42);
      const end = this.envelope(subGain.gain, time, .004, 1.15, .5 * event.vel);
      sub.connect(subGain);
      this.route(subGain, this.drumBus, .18, 0);
      sub.start(time);
      sub.stop(end + .05);

      const noise = this.noiseSource();
      const band = ctx.createBiquadFilter();
      const gain = ctx.createGain();
      band.type = "bandpass";
      band.frequency.setValueAtTime(5200, time);
      band.frequency.exponentialRampToValueAtTime(180, time + 1.5);
      band.Q.value = .8;
      const noiseEnd = this.envelope(gain.gain, time, .002, 1.5, .18 * event.vel);
      noise.connect(band).connect(gain);
      this.route(gain, this.drumBus, .36, .06);
      noise.start(time, this.random(), noiseEnd - time + .03);
    }

    riser(event, time) {
      const ctx = this.ctx;
      const noise = this.noiseSource();
      const band = ctx.createBiquadFilter();
      const gain = ctx.createGain();
      band.type = "bandpass";
      band.Q.value = 2.6;
      band.frequency.setValueAtTime(180, time);
      band.frequency.exponentialRampToValueAtTime(7600, time + event.dur);
      gain.gain.setValueAtTime(.0001, time);
      gain.gain.exponentialRampToValueAtTime(.09 * event.vel, time + event.dur * .88);
      gain.gain.exponentialRampToValueAtTime(.0001, time + event.dur);
      noise.connect(band).connect(gain);
      this.route(gain, this.musicBus, .18, .06);
      noise.start(time, this.random() * .1, event.dur + .03);
    }

    dispatch(event, time) {
      if (!this.ctx) throw new Error("Cannot dispatch " + event.type + " without an AudioContext.");
      const lateness = this.ctx.currentTime - time;
      if (lateness > .08) {
        throw new Error(event.type + " event missed its schedule by " + Math.round(lateness * 1000) + "ms.");
      }
      switch (event.type) {
        case "kick": this.kick(event, time); break;
        case "snare": this.snare(event, time); break;
        case "hat": this.hat(event, time); break;
        case "bass": this.bass(event, time); break;
        case "pluck": this.pluck(event, time); break;
        case "pad": this.pad(event, time); break;
        case "drone": this.drone(event, time); break;
        case "lead": this.lead(event, time); break;
        case "hit": this.hit(event, time); break;
        case "riser": this.riser(event, time); break;
        default: throw new Error("Unknown score event type: " + event.type);
      }
    }

    scheduler() {
      if (!this.ctx) throw new Error("The audio scheduler has no AudioContext.");
      if (this.paused && this.ctx.state === "suspended") return;
      if (this.ctx.state !== "running") {
        throw new Error("Unexpected AudioContext state: " + this.ctx.state);
      }
      const horizon = this.ctx.currentTime + .2;
      while (this.index < this.score.events.length) {
        const event = this.score.events[this.index];
        const at = this.startAt + event.at;
        if (at >= horizon) break;
        this.dispatch(event, at);
        this.index++;
      }
    }

    getTime() {
      if (!this.ctx) throw new Error("The audio transport is not initialized.");
      return Math.max(0, this.ctx.currentTime - this.startAt);
    }

    levels() {
      if (!this.analyser) throw new Error("The audio analyser is not initialized.");
      this.analyser.getByteFrequencyData(this.spectrum);
      let low = 0, mid = 0, high = 0;
      for (let i = 1; i < 10; i++) low += this.spectrum[i];
      for (let i = 10; i < 80; i++) mid += this.spectrum[i];
      for (let i = 80; i < 210; i++) high += this.spectrum[i];
      return {
        low: low / (9 * 255),
        mid: mid / (70 * 255),
        high: high / (130 * 255)
      };
    }

    async togglePause() {
      if (!this.ctx) throw new Error("Cannot pause before the audio transport starts.");
      if (this.ctx.state === "running") {
        this.paused = true;
        try {
          await this.ctx.suspend();
        } catch (error) {
          this.paused = false;
          throw error;
        }
      } else if (this.ctx.state === "suspended" && this.paused) {
        await this.ctx.resume();
        this.paused = false;
      } else {
        throw new Error("Cannot toggle pause from AudioContext state: " + this.ctx.state);
      }
      return this.paused;
    }

    toggleMute() {
      if (!this.ctx) throw new Error("Cannot mute before the audio transport starts.");
      this.muted = !this.muted;
      const now = this.ctx.currentTime;
      this.master.gain.cancelScheduledValues(now);
      this.master.gain.setTargetAtTime(this.muted ? 0 : .72, now, .025);
      return this.muted;
    }

    async stop() {
      if (this.timer) clearInterval(this.timer);
      this.timer = 0;
      if (this.ctx && this.ctx.state !== "closed") await this.ctx.close();
      this.ctx = null;
    }
  }

  class Demo {
    constructor() {
      this.canvas = $("#stage");
      this.boot = $("#boot");
      this.launch = $("#launch");
      this.score = new Score();
      this.audio = new AudioEngine(this.score, (error) => this.fail(error));
      this.renderer = new Renderer(this.canvas, (error) => this.fail(error));
      this.running = false;
      this.preview = false;
      this.previewPaused = false;
      this.previewStart = 0;
      this.previewAt = 0;
      this.ending = false;
      this.starting = false;
      this.failed = false;
      this.activeCue = -1;
      this.lastHudUpdate = 0;
      this.controlTimer = 0;
      this.params = new URLSearchParams(location.search);
      this.forceMute = this.params.get("mute") === "1";
      this.meterBars = [];
      this.setupDom();
      this.setupEvents();
      this.setupPreview();
      this.frame = this.frame.bind(this);
      requestAnimationFrame(this.frame);
    }

    setupDom() {
      const meter = $("#meter");
      for (let i = 0; i < 16; i++) {
        const bar = document.createElement("i");
        meter.appendChild(bar);
        this.meterBars.push(bar);
      }
      window.__demo = {
        ready: true,
        time: 0,
        scene: 0,
        fps: 0,
        scale: this.renderer.scale,
        resolution: [this.renderer.width, this.renderer.height],
        audioState: "idle",
        errors: []
      };
    }

    runAction(promise) {
      Promise.resolve(promise).catch((error) => this.fail(error));
    }

    setupEvents() {
      this.launch.addEventListener("click", () => this.runAction(this.start()));
      $("#pause").addEventListener("click", () => this.runAction(this.togglePause()));
      $("#mute").addEventListener("click", () => this.runAction(this.toggleMute()));
      $("#fullscreen").addEventListener("click", () => this.runAction(this.fullscreen()));
      $("#restart").addEventListener("click", () => this.runAction(this.restart()));

      addEventListener("keydown", (event) => {
        if (this.failed) return;
        if ((event.key === "Enter" || event.code === "Space") && !this.running) {
          event.preventDefault();
          this.runAction(this.start());
        } else if (event.code === "Space" && this.running) {
          event.preventDefault();
          this.runAction(this.togglePause());
        } else if (event.key.toLowerCase() === "m" && this.running && !this.preview) {
          this.runAction(this.toggleMute());
        } else if (event.key.toLowerCase() === "f") {
          this.runAction(this.fullscreen());
        } else if (event.key.toLowerCase() === "r") {
          this.runAction(this.restart());
        }
      });

      const wake = () => this.wakeControls();
      addEventListener("pointermove", wake, { passive: true });
      addEventListener("pointerdown", wake, { passive: true });
      addEventListener("touchstart", wake, { passive: true });
      addEventListener("resize", () => this.fitCaption(), { passive: true });
      this.runAction(document.fonts.ready.then(() => {
        if (!document.fonts.check('16px "Axiom Mono"')) {
          throw new Error("The embedded display font failed to load.");
        }
        this.fitCaption();
      }));
    }

    setupPreview() {
      const preview = Number(this.params.get("t"));
      if (this.params.has("t") && Number.isFinite(preview) && preview >= 0) {
        this.preview = true;
        this.previewPaused = false;
        this.previewAt = clamp(preview, 0, DURATION - .01);
        this.previewStart = performance.now() / 1000;
        this.running = true;
        this.forceMute = true;
        this.boot.classList.add("hidden");
        document.body.classList.add("running");
        this.wakeControls();
      }
    }

    async beginPlayback() {
      if (this.failed) return;
      this.preview = false;
      this.previewPaused = false;
      this.ending = false;
      await this.audio.start(this.forceMute);
      if (this.failed) {
        await this.audio.stop();
        return;
      }
      this.running = true;
      this.boot.classList.add("hidden");
      document.body.classList.add("running");
      $("#launch-label").textContent = "Initiate signal";
      $("#launch-status").textContent = "WebGL2 / procedural audio";
      this.updateMuteUi(this.audio.muted);
      this.updatePauseUi(false);
      this.wakeControls();
    }

    async start() {
      if (this.failed || (this.running && !this.ending) || this.starting) return;
      this.starting = true;
      this.launch.disabled = true;
      $("#launch-label").textContent = "Synchronizing";
      $("#launch-status").textContent = "Building deterministic signal path";
      try {
        await this.beginPlayback();
      } finally {
        this.starting = false;
        if (!this.failed) this.launch.disabled = false;
      }
    }

    async restart() {
      if (this.failed || this.starting) return;
      this.starting = true;
      this.launch.disabled = true;
      try {
        this.running = false;
        this.ending = false;
        this.preview = false;
        this.previewPaused = false;
        await this.audio.stop();
        this.audio = new AudioEngine(this.score, (error) => this.fail(error));
        await this.beginPlayback();
      } finally {
        this.starting = false;
        if (!this.failed) this.launch.disabled = false;
      }
    }

    async togglePause() {
      if (this.preview) {
        if (this.previewPaused) {
          this.previewStart = performance.now() / 1000;
          this.previewPaused = false;
        } else {
          this.previewAt = this.time();
          this.previewPaused = true;
        }
        this.updatePauseUi(this.previewPaused);
        return;
      }
      const paused = await this.audio.togglePause();
      this.updatePauseUi(paused);
    }

    updatePauseUi(paused) {
      const button = $("#pause");
      button.setAttribute("aria-label", paused ? "Resume" : "Pause");
      button.title = paused ? "Resume" : "Pause";
      $("#pause-icon").innerHTML = paused
        ? '<path d="m8 5 11 7-11 7z"></path>'
        : '<path d="M8 5v14M16 5v14"></path>';
    }

    async toggleMute() {
      const muted = this.audio.toggleMute();
      this.updateMuteUi(muted);
    }

    updateMuteUi(muted) {
      const button = $("#mute");
      button.setAttribute("aria-label", muted ? "Unmute" : "Mute");
      button.title = muted ? "Unmute" : "Mute";
      $("#mute-icon").innerHTML = muted
        ? '<path d="M11 5 6 9H2v6h4l5 4zM22 9l-6 6M16 9l6 6"></path>'
        : '<path d="M11 5 6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12"></path>';
    }

    async fullscreen() {
      if (!document.fullscreenElement) {
        if (!document.documentElement.requestFullscreen) {
          throw new Error("Fullscreen mode is unavailable in this browser.");
        }
        await document.documentElement.requestFullscreen();
      } else {
        if (!document.exitFullscreen) throw new Error("The browser cannot exit fullscreen mode.");
        await document.exitFullscreen();
      }
    }

    wakeControls() {
      if (!this.running) return;
      document.body.classList.add("controls-awake");
      clearTimeout(this.controlTimer);
      this.controlTimer = setTimeout(function () {
        document.body.classList.remove("controls-awake");
      }, 2400);
    }

    chapterAt(time) {
      let chapter = CHAPTERS[0];
      for (let i = 1; i < CHAPTERS.length; i++) {
        if (time >= CHAPTERS[i].bar * BAR) chapter = CHAPTERS[i];
        else break;
      }
      return chapter;
    }

    time() {
      if (this.preview) {
        return this.previewPaused
          ? this.previewAt
          : this.previewAt + performance.now() / 1000 - this.previewStart;
      }
      if (this.running) return this.audio.getTime();
      return (performance.now() / 1000) % 15;
    }

    fitCaption() {
      const caption = $("#caption");
      const main = $("#caption-main");
      if (!main.firstElementChild || caption.clientWidth === 0) return;
      let size = innerWidth <= 640
        ? Math.min(48, innerWidth * .105)
        : Math.min(96, innerWidth * .07);
      main.style.fontSize = size + "px";
      let widest = 0;
      Array.from(main.children).forEach(function (line) {
        widest = Math.max(widest, line.scrollWidth);
      });
      if (widest > caption.clientWidth) {
        size = Math.max(22, Math.floor(size * caption.clientWidth / widest * .98));
        main.style.fontSize = size + "px";
      }
    }

    energyFor(time) {
      const bar = time / BAR;
      let base = .1;
      if (bar >= 8) base = .28;
      if (bar >= 16) base = .48;
      if (bar >= 24) base = .66;
      if (bar >= 40) base = .36;
      if (bar >= 48) base = .72;
      if (bar >= 56) base = .68;
      if (bar >= 64) base = .82;
      if (bar >= 72) base = 1;
      if (bar >= 88) base = .24;
      return base;
    }

    updateHud(time, chapter, levels) {
      if (!this.running) return;
      $("#chapter-index").textContent = chapter.index;
      $("#chapter-name").textContent = chapter.name;
      const minutes = Math.floor(time / 60);
      const seconds = Math.floor(time % 60);
      const millis = Math.floor((time % 1) * 1000);
      $("#chapter-time").textContent =
        String(minutes).padStart(3, "0") + ":" +
        String(seconds).padStart(2, "0") + "." +
        String(millis).padStart(3, "0");
      $("#progress-fill").style.transform = "scaleX(" + clamp(time / DURATION, 0, 1) + ")";
      $("#readout").textContent = "Carrier 128.00 / " + (levels.low > .1 ? "locked" : "seeking");

      const energy = clamp((levels.low + levels.mid + levels.high) * .75, .05, 1);
      this.meterBars.forEach(function (bar, index) {
        const harmonic = .2 + .8 * Math.abs(Math.sin(time * 2.4 + index * .61));
        bar.style.transform = "scaleY(" + (.25 + energy * harmonic * 3.7) + ")";
        bar.style.opacity = String(.22 + energy * .68);
      });

      let cueIndex = -1;
      for (let i = 0; i < CUES.length; i++) {
        if (time >= CUES[i].start && time < CUES[i].end) {
          cueIndex = i;
          break;
        }
      }
      if (cueIndex !== this.activeCue) {
        this.activeCue = cueIndex;
        const caption = $("#caption");
        if (cueIndex >= 0) {
          const cue = CUES[cueIndex];
          const main = $("#caption-main");
          main.replaceChildren();
          cue.main.forEach(function (line) {
            const span = document.createElement("span");
            span.textContent = line;
            main.appendChild(span);
          });
          $("#caption-sub").textContent = cue.sub;
          this.fitCaption();
          caption.classList.add("visible");
        } else {
          caption.classList.remove("visible");
        }
      }
    }

    async finish() {
      if (this.ending) return;
      this.ending = true;
      await new Promise(function (resolve) { setTimeout(resolve, 1800); });
      if (!this.ending) return;
      this.running = false;
      document.body.classList.remove("running", "controls-awake");
      $("#launch-label").textContent = "Replay transmission";
      $("#launch-status").textContent = "Transmission complete / 03:00";
      this.boot.classList.remove("hidden");
      await this.audio.stop();
    }

    frame() {
      if (this.failed) return;
      try {
        let time = this.time();
        if (this.running && time >= DURATION) {
          time = DURATION;
          if (!this.ending) this.runAction(this.finish());
        }
        const chapter = this.running ? this.chapterAt(time) : CHAPTERS[0];
        const chapterStart = chapter.bar * BAR;
        const local = this.running ? time - chapterStart : time;
        const kick = this.score.pulse("kick", time, .16);
        const snare = this.score.pulse("snare", time, .22);
        const cut = smoothstep(0, .8, local);
        const levels = this.running && !this.preview
          ? this.audio.levels()
          : { low: 0, mid: 0, high: 0 };
        const energy = clamp(this.energyFor(time) + levels.mid * .25, 0, 1.2);
        const fadeIn = smoothstep(0, 1.2, time);
        const fadeOut = 1 - smoothstep(DURATION - 3.2, DURATION, time);
        const fade = this.running ? fadeIn * fadeOut : 1;

        this.renderer.render({
          time: time,
          local: local,
          scene: chapter.scene,
          kick: kick,
          snare: snare,
          energy: energy,
          cut: cut,
          fade: fade
        });

        if (performance.now() - this.lastHudUpdate > 55) {
          this.lastHudUpdate = performance.now();
          this.updateHud(time, chapter, levels);
        }

        const debug = window.__demo;
        debug.time = Number(time.toFixed(3));
        debug.scene = chapter.scene;
        debug.fps = Number((1000 / this.renderer.frameEma).toFixed(1));
        debug.scale = Number(this.renderer.scale.toFixed(3));
        debug.resolution = [this.renderer.width, this.renderer.height];
        debug.audioState = this.audio.ctx ? this.audio.ctx.state : (this.preview ? "preview" : "idle");
      } catch (error) {
        this.fail(error);
        return;
      }
      if (!this.failed) requestAnimationFrame(this.frame);
    }

    fail(error) {
      if (this.failed) return;
      this.failed = true;
      this.running = false;
      this.ending = false;
      this.starting = false;
      clearTimeout(this.controlTimer);
      document.body.classList.remove("running", "controls-awake");
      this.launch.disabled = true;
      const message = error && error.stack ? error.stack : String(error);
      console.error(error);
      window.__demo.errors.push(message);
      window.__demo.audioState = "failed";
      $("#fatal").textContent = "AXIOM BLOOM could not continue.\n\n" + message;
      $("#fatal").classList.add("visible");
      this.audio.stop().catch((stopError) => {
        const stopMessage = stopError && stopError.stack ? stopError.stack : String(stopError);
        console.error(stopError);
        window.__demo.errors.push(stopMessage);
        $("#fatal").textContent += "\n\nAudio shutdown also failed:\n" + stopMessage;
      });
    }
  }

  try {
    window.__axiom = new Demo();
  } catch (error) {
    const fatal = $("#fatal");
    fatal.textContent = "AXIOM BLOOM could not initialize.\n\n" + (error.stack || error);
    fatal.classList.add("visible");
    console.error(error);
  }
  </script>
</body>
</html>
