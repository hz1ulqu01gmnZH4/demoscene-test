    ['LOONIES', 'n'], ['RAZOR 1911', 'n'], ['CNCD', 'n'],
    ['', 's'],
    ['AND EVERYONE WHO STILL', 'p'], ['WRITES DEMOS FOR THE JOY OF IT', 'p'],
    ['', 's'],
    ['SEE YOU AT THE NEXT PARTY', 'h2'],
  ];
  // 2048 is the smallest texture size WebGL2 guarantees, so the scroll has to
  // fit inside it — spacing below is chosen to land the last line near y=1850
  TEX.greets = makeTextTexture(1024, 2048, (x, w, h) => {
    x.textBaseline = 'middle'; x.fillStyle = '#fff';
    let y = 120;
    for(const [text, kind] of GREETS){
      if(kind === 's'){ y += 60; continue; }
      if(kind === 'h1'){ x.globalAlpha = 1; x.font = '800 76px ' + FONT; tracked(x, text, w/2, y, 20); y += 150; }
      else if(kind === 'h2'){ x.globalAlpha = 0.95; x.font = '700 50px ' + FONT; tracked(x, text, w/2, y, 12); y += 104; }
      else if(kind === 'p'){ x.globalAlpha = 0.8; x.font = '500 38px ' + FONT; tracked(x, text, w/2, y, 6); y += 70; }
      else { x.globalAlpha = 0.92; x.font = '600 52px ' + FONT; tracked(x, text, w/2, y, 10); y += 88; }
    }
    if(y > h) console.warn('greetings scroll overflows its texture: ' + y + ' > ' + h);
  });

  TEX.label = makeTextTexture(700, 64, () => {});    // rewritten per section
}
function setLabel(text){
  const t = TEX.label, c = t.canvas, x = c.getContext('2d');
  x.clearRect(0, 0, c.width, c.height);
  x.fillStyle = '#fff'; x.textBaseline = 'middle'; x.textAlign = 'left';
  x.font = '600 30px ' + FONT;
  let cx = 6;
  for(const ch of text){ x.fillText(ch, cx, 34); cx += x.measureText(ch).width + 7; }
  gl.bindTexture(gl.TEXTURE_2D, t.tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, c);
}
// place a texture: centred at (cx,cy) in screen uv, spanning wFrac of the width
function place(tex, cx, cy, wFrac){
  const aspectScreen = canvas.width/canvas.height;
  const wS = wFrac;
  const hS = wFrac/tex.aspect*aspectScreen;
  return [1/wS, 1/hS, -(cx - wS/2)/wS, -(cy - hS/2)/hS];
}

// ── programs ──────────────────────────────────────────────────────────────
const PROG = {};
const SHADER_JOBS = [
  ['tunnel',   () => PROG.tunnel   = program(FS_TUNNEL,   'tunnel')],
  ['bulb',     () => PROG.bulb     = program(FS_BULB,     'bulb')],
  ['menger',   () => PROG.menger   = program(FS_MENGER,   'menger')],
  ['spheres',  () => PROG.spheres  = program(FS_SPHERES,  'spheres')],
  ['metaball', () => PROG.metaball = program(FS_METABALL, 'metaball')],
  ['greets',   () => PROG.greets   = program(FS_GREETS,   'greets')],
  ['vortex',   () => PROG.vortex   = program(FS_PARTICLE, 'vortex', VS_PARTICLE)],
  ['text',     () => PROG.text     = program(FS_TEXT,     'text')],
  ['bright',   () => PROG.bright   = program(FS_BRIGHT,   'bright')],
  ['blur',     () => PROG.blur     = program(FS_BLUR,     'blur')],
  ['comp',     () => PROG.comp     = program(FS_COMP,     'comp')],
];

// ── the director: what is on screen, when ─────────────────────────────────
const PARTICLES = 98304;
const TRANS_DUR = 0.55;
// transition style at the start of each section (see FS_COMP)
const TRANS_TYPE = [0, 0, 2, 3, 2, 1, 4, 3];
const LETTERBOX  = [1, 0.55, 0, 0, 0, 0.3, 0, 1];

function sectionAtTime(t){
  const bar = t/BAR;
  let i = 0;
  for(let k = 0; k < SECTIONS.length; k++) if(bar >= SECTIONS[k].bar) i = k;
  return i;
}
// text cards: [texture key, start bar, end bar, centre x, centre y, width, fade, tint]
// centre y is top-origin, matching the canvas the glyphs were drawn on
const CARDS = [
  ['title',  1.6,  7.6, 0.5, 0.44, 0.62, 1.2, [1.0, 1.0, 1.0]],
  ['sub',    4.2,  7.8, 0.5, 0.66, 0.40, 0.8, [0.62, 0.78, 1.0]],
  ['credit', 33.0, 39.2, 0.5, 0.48, 0.46, 1.0, [0.95, 0.92, 1.0]],
  ['end',    93.2, 99.5, 0.5, 0.48, 0.52, 1.4, [1.0, 0.97, 0.92]],
];

let curSection = -1, transStart = -99, transType = 0, labelShown = -1;

function drawScene(secIdx){
  const sec = SECTIONS[secIdx];
  const name = OPT.scene || sec.scene;
  const T = RT.scene;

  if(name === 'vortex'){
    bindTarget(T);
    gl.clearColor(0.008, 0.010, 0.022, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.useProgram(PROG.vortex.prog);
    commonUniforms(PROG.vortex, T.w, T.h);
    setU(PROG.vortex, 'uCount', PARTICLES);
    gl.drawArrays(gl.POINTS, 0, PARTICLES);
    gl.disable(gl.BLEND);
    return;
  }

  const p = PROG[name];
  if(!p) throw new Error('no program for scene "' + name + '"');
  if(name === 'greets'){
    pass(p, T, [{ tex: TEX.greets.tex, name: 'uTex' }], { uScroll: mix(-0.31, 1.06, CLOCK.prog) });
  } else {
    pass(p, T, null, null);
  }
}

function drawCards(){
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);
  const bar = CLOCK.t/BAR;
  for(const [key, b0, b1, cx, cy, wf, fade, tint] of CARDS){
    if(bar < b0 || bar > b1) continue;
    const tex = TEX[key];
    const inA  = smoothstep(b0, b0 + fade*0.5, bar);
    const outA = 1 - smoothstep(b1 - fade, b1, bar);
    const alpha = inA*outA;
    if(alpha <= 0.001) continue;
    const reveal = clamp((bar - b0)/(fade*1.1), 0, 1);
    pass(PROG.text, RT.scene, [{ tex: tex.tex, name: 'uTex' }], {
      uXform: place(tex, cx, cy, wf), uAlpha: alpha, uReveal: reveal, uTint: tint,
    });
  }
  // part label, bottom left, for three seconds after each section starts
  const sec = SECTIONS[curSection];
  const since = CLOCK.t - sec.bar*BAR;
  if(since >= 0 && since < 3.4 && curSection > 0){
    const a = smoothstep(0, 0.35, since)*(1 - smoothstep(2.9, 3.4, since));
    const t = TEX.label;
    pass(PROG.text, RT.scene, [{ tex: t.tex, name: 'uTex' }], {
      uXform: place(t, 0.175, 0.918, 0.30), uAlpha: a*0.85,
      uReveal: clamp(since/0.7, 0, 1), uTint: [0.70, 0.85, 1.0],
    });
  }
  gl.disable(gl.BLEND);
}

// ── frame ─────────────────────────────────────────────────────────────────
const AUD = [0,0,0,0];
let song = null, ended = false;

function frame(t){
  CLOCK.t = t;
  CLOCK.beat = t/SPB;

  const secIdx = clamp(sectionAtTime(t), 0, SECTIONS.length - 1);
  const sec = SECTIONS[secIdx];
  CLOCK.prog = clamp((t - sec.bar*BAR)/(sec.len*BAR), 0, 1);

  if(song && song.env) sampleEnv(song.env, t, AUD);
  CLOCK.aud[0] = AUD[0]; CLOCK.aud[1] = AUD[1]; CLOCK.aud[2] = AUD[2]; CLOCK.aud[3] = AUD[3];

  // section change -> freeze the outgoing frame and start a transition
  if(secIdx !== curSection){
    if(curSection >= 0 && TRANS_TYPE[secIdx] !== 0){
      gl.bindFramebuffer(gl.READ_FRAMEBUFFER, RT.scene.fb);
      gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, RT.prev.fb);
      gl.blitFramebuffer(0, 0, RT.scene.w, RT.scene.h, 0, 0, RT.prev.w, RT.prev.h,
                         gl.COLOR_BUFFER_BIT, gl.NEAREST);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      transStart = t; transType = TRANS_TYPE[secIdx];
    }
    curSection = secIdx;
    if(labelShown !== secIdx){
      setLabel('PART ' + (secIdx + 1) + ' — ' + sec.name);
      labelShown = secIdx;
    }
  }

  drawScene(secIdx);
  drawCards();

  // bloom: half-res bright pass, then two separable gaussian levels
  pass(PROG.bright, RT.b1a, [{ tex: RT.scene.tex, name: 'uSrc' }], { uThresh: 0.62 });
  pass(PROG.blur,   RT.b1b, [{ tex: RT.b1a.tex,   name: 'uSrc' }], { uDir: [1.35, 0] });
  pass(PROG.blur,   RT.b1a, [{ tex: RT.b1b.tex,   name: 'uSrc' }], { uDir: [0, 1.35] });
  pass(PROG.blur,   RT.b2a, [{ tex: RT.b1a.tex,   name: 'uSrc' }], { uDir: [1.6, 0] });
  pass(PROG.blur,   RT.b2b, [{ tex: RT.b2a.tex,   name: 'uSrc' }], { uDir: [0, 1.6] });

  const trans = transStart > -50 ? clamp((t - transStart)/TRANS_DUR, 0, 1) : 1;

  // fades: up from black at the start, down to black at the very end
  let fade = smoothstep(0, 2.2, t);
  const outStart = SONG + 1.2;
  fade *= 1 - smoothstep(outStart, outStart + 3.4, t);

  // flash on section hits and on kick transients
  let flash = AUD[3]*0.085;
  const sinceSec = t - sec.bar*BAR;
  if(sinceSec >= 0 && sinceSec < 0.5 && curSection > 0) flash += 0.42*(1 - sinceSec/0.5);
  if(trans < 1 && transType === 2) flash += 0.35*(1 - Math.abs(trans*2 - 1));

  // letterbox eases between sections
  const lb = mix(LETTERBOX[Math.max(0, secIdx - 1)], LETTERBOX[secIdx], smoothstep(0, 1.4, sinceSec));

  pass(PROG.comp, null, [
    { tex: RT.scene.tex, name: 'uScene' },
    { tex: RT.prev.tex,  name: 'uPrev'  },
    { tex: RT.b1a.tex,   name: 'uBloomA'},
    { tex: RT.b2b.tex,   name: 'uBloomB'},
  ], {
    uTrans: trans, uTransType: transType, uFade: fade,
    uFlash: Math.min(flash, 0.85), uBars: lb, uBloom: 0.85 + 0.55*AUD[0],
  });

  if(!ended && t > outStart + 3.6) finish();
}

// ── adaptive resolution ───────────────────────────────────────────────────
const perf = { acc: 0, n: 0, last: 0, changes: 0 };
function tuneQuality(dt){
  perf.acc += dt; perf.n++;
  if(perf.n < 45) return;
  const avg = perf.acc/perf.n;
  perf.acc = 0; perf.n = 0;
  if(avg > 0.024 && quality > 0.5 && perf.changes < 6){ quality = Math.max(0.5, quality - 0.12); perf.changes++; resize(); }
  else if(avg < 0.011 && quality < 1.0 && perf.changes < 6){ quality = Math.min(1.0, quality + 0.08); perf.changes++; resize(); }
}

// ── clock sources ─────────────────────────────────────────────────────────
let actx = null, srcNode = null, audioT0 = 0, wallT0 = 0;
const now = () => {
  if(actx && srcNode) return actx.currentTime - audioT0 + OPT.start;
  return (performance.now() - wallT0)/1000 + OPT.start;
};

let raf = 0, lastFrame = 0, fps = 0;
function loop(){
  raf = requestAnimationFrame(loop);
  const nowMs = performance.now();
  const dt = lastFrame ? (nowMs - lastFrame)/1000 : 0.016;
  lastFrame = nowMs;
  fps = mix(fps || 60, 1/Math.max(dt, 1e-4), 0.08);
  tuneQuality(dt);
  frame(now());
  if(hudOn) drawHud(dt);
}

const hudEl = document.getElementById('hud');
let hudOn = OPT.hud;
function drawHud(){
  const s = SECTIONS[Math.max(0, curSection)];
  hudEl.textContent =
    'AFTERGLOW  ' + now().toFixed(2) + 's / ' + SONG.toFixed(1) + 's\n' +
    'part  ' + (curSection + 1) + '/' + SECTIONS.length + '  ' + s.name + '  (' + s.scene + ')\n' +
    'bar   ' + (now()/BAR).toFixed(2) + '   beat ' + (now()/SPB).toFixed(2) + '\n' +
    'fps   ' + fps.toFixed(1) + '   scale ' + quality.toFixed(2) + '   ' + RT.w + 'x' + RT.h + '\n' +
    'aud   rms ' + AUD[0].toFixed(2) + '  low ' + AUD[1].toFixed(2) +
          '  hi ' + AUD[2].toFixed(2) + '  kick ' + AUD[3].toFixed(2) + '\n' +
    'fbo   ' + (HAS_FLOAT ? 'RGBA16F' : 'RGBA8');
}

// ── loading ───────────────────────────────────────────────────────────────
const ui   = document.getElementById('ui');
const pbar = document.getElementById('pbar');
const pmsg = document.getElementById('pmsg');
const ppct = document.getElementById('ppct');
const goBtn = document.getElementById('go');

function setProgress(p, msg){
  pbar.style.width = (p*100).toFixed(1) + '%';
  ppct.textContent = Math.round(p*100) + '%';
  if(msg) pmsg.textContent = msg;
}

let jobIdx = 0;
function load(){
  const budgetEnd = performance.now() + 13;
  try{
    while(performance.now() < budgetEnd){
      if(jobIdx < SHADER_JOBS.length){
        const [name, fn] = SHADER_JOBS[jobIdx++];
        fn();
        setProgress(0.24*(jobIdx/SHADER_JOBS.length), 'COMPILING ' + name.toUpperCase());
        continue;
      }
      if(jobIdx === SHADER_JOBS.length){
        buildTextures();
        jobIdx++;
        setProgress(0.26, 'RASTERISING GLYPHS');
        continue;
      }
      if(!song) song = new SongRenderer();
      const done = song.step();
      setProgress(0.28 + 0.72*song.progress, song.message);
      if(done){
        setProgress(1, 'READY — ' + Math.round(SONG) + 's OF MUSIC');
        goBtn.classList.add('on');
        goBtn.focus();
        if(OPT.nosound) start();
        return;
      }
    }
  } catch(e){ die('LOAD FAILED', e); }
  requestAnimationFrame(load);
}

// ── start / stop ──────────────────────────────────────────────────────────
function start(){
  if(raf) return;
  ui.classList.add('gone');
  setTimeout(() => { ui.style.display = 'none'; }, 900);
  resize();

  if(!OPT.nosound){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) die('NO WEB AUDIO', new Error('AudioContext is unavailable; retry with ?nosound=1 for a silent run.'));
    // ask for the rate the song was rendered at; if the device refuses, Web
    // Audio resamples the buffer for us and the tempo is still correct
    try { actx = new AC({ sampleRate: SR }); } catch(e){ actx = new AC(); }
    if(actx.sampleRate !== SR) console.warn('device runs at ' + actx.sampleRate + ' Hz; buffer will be resampled from ' + SR);

    const buf = song.toAudioBuffer(actx);
    srcNode = actx.createBufferSource();
    srcNode.buffer = buf;
    const g = actx.createGain();
    g.gain.value = 0.92;
    srcNode.connect(g); g.connect(actx.destination);
    const when = actx.currentTime + 0.08;
    audioT0 = when;                       // now() = currentTime - audioT0 + OPT.start
    srcNode.start(when, OPT.start);
    actx.resume();
  }
  wallT0 = performance.now();
  lastFrame = 0;
  hudEl.style.display = hudOn ? 'block' : 'none';
  loop();
}

function finish(){
  ended = true;
  cancelAnimationFrame(raf); raf = 0;
  if(srcNode){ try { srcNode.stop(); } catch(e){ /* already stopped by the buffer ending */ } }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  ui.style.display = 'flex';
  requestAnimationFrame(() => ui.classList.remove('gone'));
  setProgress(1, 'THAT WAS AFTERGLOW');
  goBtn.textContent = 'RUN IT AGAIN';
  goBtn.classList.add('on');
  goBtn.onclick = () => location.reload();
}

goBtn.addEventListener('click', start);
window.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !raf && goBtn.classList.contains('on')) start();
  if(e.key === 'f' || e.key === 'F'){
    if(document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  }
  if(e.key === 'h' || e.key === 'H'){ hudOn = !hudOn; hudEl.style.display = hudOn ? 'block' : 'none'; }
  if(e.key === 'Escape' && raf) finish();
});

// small hook for tinkering (and for the automated smoke test)
window.AFTERGLOW = {
  sections: SECTIONS,
  start, finish,
  get time(){ return now(); },
  get running(){ return !!raf; },
  get ready(){ return !!(song && song.env); },
  get fps(){ return fps; },
  get quality(){ return quality; },
  get part(){ return curSection >= 0 ? SECTIONS[curSection].name : null; },
  get audio(){ return AUD.slice(); },
  audioState(){ return actx ? { state: actx.state, rate: actx.sampleRate, clock: 'audio' }
                            : { state: 'silent', clock: 'wall' }; },
  // only meaningful on the wall clock (?nosound=1); the audio clock is the boss
  seek(sec){
    if(actx) return false;
    wallT0 = performance.now() - (sec - OPT.start)*1000;
    ended = false;
    return true;
  },
};

resize();
load();

})();
</script>
</body>
</html>
